replicaCount: 1

image:
  repository: minio/minio
  tag: RELEASE.2025-09-07T16-13-09Z
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    api: 9000
    console: 9001

# accessKey: minioadmin       # moved to K8s secret when externalSecret enabled
# secretKey: MinioAdmin2026!  # moved to K8s secret when externalSecret enabled
externalSecret:
  enabled: false
  refreshInterval: 1h
  store:
    name: main
    kind: ClusterSecretStore
  remoteRefs:
    accessKey: /middleware/minio/access-key
    secretKey: /middleware/minio/secret-key

config:
  region: us-east-1
  browser: on
  maxConnections: 256
  maxWorkers: 16
  storageClass: STANDARD
  apiRequestsMax: 100
  enableCompression: true
  maxUploadSize: 5Gi
  memoryLimitMb: 256
  driveCount: 1

persistence:
  enabled: false
  size: 10Gi

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 500m