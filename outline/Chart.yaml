apiVersion: v2
name: outline
description: Outline Wiki - Knowledge base
type: application
version: 1.0.0
appVersion: latest

dependencies:
  - name: postgresql
    version: ~15.0
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: ~19.0
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: minio
    version: ~14.0
    repository: https://charts.bitnami.com/bitnami
    condition: minio.enabled