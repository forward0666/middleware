{{- if not .Values.externalSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: outline-secret
type: Opaque
stringData:
  secret_key: {{ .Values.env.SECRET_KEY | quote }}
  utils_secret: {{ .Values.env.UTILS_SECRET | quote }}
  db-password: {{ .Values.postgresql.external.password | quote }}
  minio-secretkey: {{ .Values.minio.external.secretKey | quote }}
{{- end }}
