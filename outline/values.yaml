# Outline Wiki Configuration
replicaCount: 1

image:
  repository: docker.getoutline.com/outlinewiki/outline
  tag: 0.81.0
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: nginx
  host: outline.local
  tls: false

# Database - external (from backup restore)
postgresql:
  enabled: false
  external:
    host: middleware-postgres
    port: 5432
    database: outline
    user: outline
    password: OutlineDB2026!  # external-secrets: /middleware/outline/db-password
    poolMin: 2
    poolMax: 20

redis:
  enabled: false
  external:
    host: middleware-redis
    port: 6379
    password: ""

minio:
  enabled: false
  external:
    endpoint: middleware-minio:9000
    # accessKey: outline        # moved to secret when externalSecret enabled
    # secretKey: OutlineMinio2026!  # moved to external-secrets when enabled
    bucket: outline

# Outline env vars
env:
  # SECRET_KEY: "bac3c713..."  # moved to external-secrets when enabled
  # UTILS_SECRET: "6f7aaea..."  # moved to external-secrets when enabled
  DEFAULT_LANGUAGE: "zh_CN"
  FORCE_HTTPS: "false"
  URL: "http://outline.local"

config:
  logLevel: warn
  maxImportSize: 50mb
  rateLimitPerMinute: 60
  documentsPerPage: 25
  enableGuestSignin: false
  enableEmailSignin: false
  enableSlack: false
  enableGoogle: false
  enableMicrosoft: false
  enableOidc: false
  deleteDocumentsEvery: 5m
  pgPoolMin: 2
  pgPoolMax: 20

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m

persistence:
  enabled: true
  size: 1Gi
externalSecret:
  enabled: false
  refreshInterval: 1h
  store:
    name: main
    kind: ClusterSecretStore
  remoteRefs:
    dbPassword: /middleware/outline/db-password
    minioSecretKey: /middleware/outline/minio-secretkey
    secretKey: /middleware/outline/secret-key
    utilsSecret: /middleware/outline/utils-secret
