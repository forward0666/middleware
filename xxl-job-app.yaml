apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: xxl-job
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/forward0666/middleware.git
    targetRevision: HEAD
    path: xxl-job
  destination:
    server: https://kubernetes.default.svc
    namespace: middleware
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true