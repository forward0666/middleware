replicaCount: 1

image:
  repository: nacos/nacos-server
  tag: v3.1.1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    client: 8848
    rpc: 9848
    raft: 9849

mode: standalone

db:
  host: middleware-mysql
  port: 3306
  name: nacos
  user: root
  password: MysqlAdmin2026!  # external-secrets: /middleware/nacos/db-password
  params: "characterEncoding=utf8&connectTimeout=2000&socketTimeout=3000&autoReconnect=true&useSSL=false&serverTimezone=UTC"
  pool:
    maxActive: 20
    maxWait: 5000
    connectionTimeout: 3000
    maxLifetime: 60000
    validationTimeout: 3000

auth:
  # token moved to external-secrets when enabled
  identityKey: "nacosIdentityKey"
  identityValue: "nacosIdentityValue2026"
  tokenExpireSeconds: 28800
  cacheEnabled: true

jvm:
  xms: 512m
  xmx: 512m
  xmn: 256m
  metaspace: 128m
  maxMetaspace: 256m

persistence:
  enabled: false

resources:
  requests:
    memory: 256Mi
    cpu: 200m
  limits:
    memory: 768Mi
    cpu: 500m
externalSecret:
  enabled: false
  refreshInterval: 1h
  store:
    name: main
    kind: ClusterSecretStore
  remoteRefs:
    dbPassword: /middleware/nacos/db-password
    authToken: /middleware/nacos/auth-token
    authIdentityKey: /middleware/nacos/auth-identity-key
    authIdentityValue: /middleware/nacos/auth-identity-value
