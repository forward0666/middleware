apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "valkey.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "valkey.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "valkey.name" . }}
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 6379
          command:
            - sh
            - -c
            - |
              mkdir -p /usr/local/etc/valkey
              cat > /usr/local/etc/valkey/valkey.conf << 'VALKEYEOF'
              maxmemory {{ .Values.config.maxmemory }}
              maxmemory-policy {{ .Values.config.maxmemoryPolicy }}
              maxclients {{ .Values.config.maxclients }}
              timeout {{ .Values.config.timeout }}
              tcp-keepalive {{ .Values.config.tcpKeepalive }}
              databases {{ .Values.config.databases }}
              save 900 1
              save 300 10
              save 60 10000
              appendonly {{ .Values.config.appendonly }}
              appendfsync {{ .Values.config.appendfsync }}
              no-appendfsync-on-rewrite {{ .Values.config.noAppendfsyncOnRewrite }}
              auto-aof-rewrite-percentage {{ .Values.config.autoAofRewritePercentage }}
              auto-aof-rewrite-min-size {{ .Values.config.autoAofRewriteMinSize }}
              slowlog-log-slower-than {{ .Values.config.slowlogLogSlowerThan }}
              slowlog-max-len {{ .Values.config.slowlogMaxLen }}
              activedefrag {{ .Values.config.activedefrag }}
              active-defrag-threshold-lower {{ .Values.config.activeDefragThresholdLower }}
              active-defrag-threshold-upper {{ .Values.config.activeDefragThresholdUpper }}
              active-defrag-cycle-min {{ .Values.config.activeDefragCycleMin }}
              active-defrag-cycle-max {{ .Values.config.activeDefragCycleMax }}
              lazyfree-lazy-eviction {{ .Values.config.lazyfreeLazyEviction }}
              lazyfree-lazy-expire {{ .Values.config.lazyfreeLazyExpire }}
              lazyfree-lazy-server-del {{ .Values.config.lazyfreeLazyServerDel }}
              io-threads-do-reads {{ .Values.config.ioThreadsDoReads }}
              io-threads {{ .Values.config.ioThreads }}
              VALKEYEOF
              valkey-server /usr/local/etc/valkey/valkey.conf
          resources:
            {{- toYaml .Values.resources | nindent 12 }}