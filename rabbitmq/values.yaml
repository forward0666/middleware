replicaCount: 1

image:
  repository: rabbitmq
  tag: 3.13.7-management-alpine
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    amqp: 5672
    management: 15672

user: middleware
password: RabbitMQ2026!

# Memory high watermark: 0.6 means trigger at 60% of available RAM
# In K8s with 512Mi limit, 60% = ~307Mi
config:
  vm_memory_high_watermark: 0.6
  vm_memory_high_watermark_paging_ratio: 0.8

persistence:
  enabled: true
  size: 1Gi

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m