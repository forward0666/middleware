replicaCount: 1

image:
  repository: rabbitmq
  tag: 3.13.7-management-alpine
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  ports:
    amqp: 5672
    management: 15672

user: middleware
password: RabbitMQ2026!

config:
  vm_memory_high_watermark: 0.6
  vm_memory_high_watermark_paging_ratio: 0.8
  disk_free_limit: "256MB"
  heartbeat: 60
  connection_max: 500
  channel_max: 500
  tcp_listen_options:
    backlog: 128
    nodelay: true
  management_agent:
    disable_metrics_collector: false
  collect_statistics: none

persistence:
  enabled: true
  size: 1Gi

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m