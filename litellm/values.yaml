replicaCount: 1

image:
  repository: ghcr.io/berriai/litellm
  tag: main-latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 4000

db:
  host: middleware-postgres
  port: 5432
  name: litellm
  user: litellm
  password: changeme123
  connectionPoolMax: 20
  connectionPoolMin: 4
  connectionTimeoutMs: 10000

persistence:
  enabled: false

config:
  logLevel: warn
  maxRequestSize: 50mb
  redisHost: middleware-redis
  redisPort: 6379
  redisDb: 0
  otelEnabled: false
  rateLimitPerSecond: 100
  numWorkers: 4
  proxyLogging: false

resources:
  requests:
    memory: 256Mi
    cpu: 200m
  limits:
    memory: 2Gi
    cpu: 500m