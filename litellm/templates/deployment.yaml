apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "litellm.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "litellm.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "litellm.name" . }}
    spec:
      containers:
        - name: litellm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_URL
              value: "postgresql://{{ .Values.db.user }}:{{ .Values.db.password }}@{{ .Values.db.host }}:{{ .Values.db.port }}/{{ .Values.db.name }}"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: master_key
            - name: DATABASE_POOL_SIZE
              value: "10"
            - name: DATABASE_POOL_MAX_OVERFLOW
              value: "5"
            - name: DATABASE_POOL_TIMEOUT
              value: "30"
            - name: LITELLM_LOG
              value: "WARNING"
            - name: LITELLM_RESUMPTION_RETRY_TIMEOUT
              value: "300"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}