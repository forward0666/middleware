# ===== OmniRoute Helm values =====
replicaCount: 1

image:
  registry: harbor.192.168.86.11.nip.io:8443
  repository: devops-admin/omniroute
  tag: 3.8.52-web-20261026
  pullPolicy: IfNotPresent

# 复用既有 Secret（不进 helm 管理，防密钥入 values）；secret.create=true 时才由 chart 创建
existingSecret: omniroute-secrets
secret:
  create: false
  initialPassword: ""
  redisUrl: "redis://omniroute-redis:6379"
  omnirouteApiKey: ""
  cloudflareApiToken: ""

env:
  dataDir: /app/data
  requireApiKey: "true"
  memoryMb: "512"
  nodeOptions: "--import=file:///app/data/ext/cloudflare-mcp-tools.mjs"

# 启动前先打 MCP 补丁再起主进程
command: "node /app/data/ext/omniroute-mcp-patch.cjs && exec node dev/run-standalone.mjs"

probes:
  path: /healthz
  port: 20128
  liveness:  { periodSeconds: 30, failureThreshold: 5, timeoutSeconds: 1 }
  readiness: { periodSeconds: 10, failureThreshold: 3, timeoutSeconds: 1 }
  startup:   { periodSeconds: 10, failureThreshold: 30, timeoutSeconds: 1 }

resources:
  requests: { cpu: 50m, memory: 256Mi }
  limits:   { cpu: 500m, memory: 768Mi }

service:
  type: NodePort
  http: { port: 20128, nodePort: 31228 }
  aux:  { port: 20129, nodePort: 31229 }

redis:
  image:
    registry: harbor.192.168.86.11.nip.io:8443
    repository: library/omniroute-redis
    tag: 8.6.5
    pullPolicy: IfNotPresent
  service: { port: 6379 }
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { cpu: 100m, memory: 128Mi }

# 复用既有 PVC（数据在内，绝不重建）
persistence:
  data:
    existingClaim: omniroute-data
    mountPath: /app/data
  redis:
    existingClaim: omniroute-redis-data
    mountPath: /data

podSecurityContext:
  fsGroup: 1000
