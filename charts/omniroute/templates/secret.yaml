{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecret | default (include "omniroute.fullname" .) }}
  labels:
    {{- include "omniroute.labels" . | nindent 4 }}
type: Opaque
stringData:
  INITIAL_PASSWORD: {{ .Values.secret.initialPassword | quote }}
  REDIS_URL: {{ .Values.secret.redisUrl | quote }}
  OMNIROUTE_API_KEY: {{ .Values.secret.omnirouteApiKey | quote }}
  CLOUDFLARE_API_TOKEN: {{ .Values.secret.cloudflareApiToken | quote }}
{{- end }}
