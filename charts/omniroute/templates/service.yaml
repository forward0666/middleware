apiVersion: v1
kind: Service
metadata:
  name: {{ include "omniroute.fullname" . }}
  labels:
    {{- include "omniroute.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "omniroute.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.http.port }}
      targetPort: {{ .Values.service.http.port }}
      nodePort: {{ .Values.service.http.nodePort }}
      protocol: TCP
    - name: aux
      port: {{ .Values.service.aux.port }}
      targetPort: {{ .Values.service.aux.port }}
      nodePort: {{ .Values.service.aux.nodePort }}
      protocol: TCP
