apiVersion: v1
kind: Service
metadata:
  name: {{ include "omniroute.fullname" . }}-redis
  labels:
    {{- include "omniroute.redisLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: omniroute-redis
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: {{ .Values.redis.service.port }}
      protocol: TCP
