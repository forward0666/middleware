apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dsh.fullname" . }}
  labels:
    {{- include "dsh.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "dsh.fullname" . }}
  template:
    metadata:
      labels:
        {{- include "dsh.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: dsh
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: LISTEN_PORT
              value: {{ .Values.relayPort | quote }}
            - name: DSH_TRUSTED_HOSTS
              value: {{ .Values.env.trustedHosts | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | default (include "dsh.fullname" .) }}
          ports:
            - name: http
              containerPort: {{ .Values.relayPort }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          startupProbe:
            exec:
              command: ["node","-e","fetch('http://127.0.0.1:'+process.env.DSH_WEB_PORT+'/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
            {{- toYaml .Values.startup | nindent 12 }}
          readinessProbe:
            exec:
              command: ["node","-e","fetch('http://127.0.0.1:'+process.env.DSH_WEB_PORT+'/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
            {{- toYaml .Values.readiness | nindent 12 }}
          livenessProbe:
            exec:
              command: ["node","-e","fetch('http://127.0.0.1:'+process.env.DSH_WEB_PORT+'/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
            {{- toYaml .Values.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "dsh.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
