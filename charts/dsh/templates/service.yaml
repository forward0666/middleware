apiVersion: v1
kind: Service
metadata:
  name: {{ include "dsh.fullname" . }}
  labels:
    {{- include "dsh.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "dsh.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.service.http.port }}
      targetPort: {{ .Values.relayPort }}
      {{- if and (eq .Values.service.type "NodePort") .Values.service.http.nodePort }}
      nodePort: {{ .Values.service.http.nodePort }}
      {{- end }}
