replicaCount: 1

image:
  repository: look0608/devops-admin-frontend
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: docker-hub

service:
  type: ClusterIP
  port: 80

timezone: Asia/Shanghai

nacos:
  addr: "nacos.middleware:8848"
  namespace: ""
  group: "devops"

resources:
  requests:
    memory: 64Mi
    cpu: 100m
  limits:
    memory: 128Mi
    cpu: 200m

ingress:
  enabled: false
  className: nginx
  host: u8-web-test.gfkdf.com
  path: /
  annotations:
    kubernetes.io/ingress.class: nginx
  tls:
    - hosts:
        - u8-web-test.gfkdf.com