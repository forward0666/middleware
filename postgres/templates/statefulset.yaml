apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postgres.fullname" . }}
spec:
  serviceName: {{ include "postgres.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "postgres.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "postgres.name" . }}
    spec:
      initContainers:
        - name: init-db
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - sh
            - -c
            - |
              psql -U postgres -c "CREATE USER outline WITH PASSWORD '{{ (index .Values.databases 0).password }}' CREATEDB;" 2>/dev/null || true
              psql -U postgres -c "CREATE DATABASE outline OWNER outline;" 2>/dev/null || true
              psql -U postgres -c "CREATE USER litellm WITH PASSWORD '{{ (index .Values.databases 1).password }}' CREATEDB;" 2>/dev/null || true
              psql -U postgres -c "CREATE DATABASE litellm OWNER litellm;" 2>/dev/null || true
          env:
            - name: PGHOST
              value: localhost
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres_password
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres_password
            - name: POSTGRES_CONFIG_FILE
              value: /etc/postgresql/postgresql.conf
          command:
            - sh
            - -c
            - |
              cat > /etc/postgresql/postgresql.conf << 'EOF'
              max_connections = {{ .Values.config.maxConnections }}
              shared_buffers = '{{ .Values.config.sharedBuffers }}'
              work_mem = '{{ .Values.config.workMem }}'
              effective_cache_size = '{{ .Values.config.effectiveCacheSize }}'
              maintenance_work_mem = '{{ .Values.config.maintenanceWorkMem }}'
              random_page_cost = {{ .Values.config.randomPageCost }}
              effective_io_concurrency = {{ .Values.config.effectiveIoConcurrency }}
              wal_level = {{ .Values.config.walLevel }}
              max_wal_size = '{{ .Values.config.maxWalSize }}'
              min_wal_size = '{{ .Values.config.minWalSize }}'
              checkpoint_timeout = {{ .Values.config.checkpointTimeout }}
              log_min_duration_statement = {{ .Values.config.logMinDurationStatement }}
              EOF
              docker-entrypoint.sh postgres -c config_file=/etc/postgresql/postgresql.conf
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}