{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-secret
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.store.name }}
    kind: {{ .Values.externalSecret.store.kind }}
  target:
    name: postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: postgres_password
      remoteRef:
        key: {{ .Values.externalSecret.remoteRefs.postgresAdminPassword }}
    - secretKey: outline-password
      remoteRef:
        key: {{ .Values.externalSecret.remoteRefs.outlinePassword }}
    - secretKey: litellm-password
      remoteRef:
        key: {{ .Values.externalSecret.remoteRefs.litellmPassword }}
{{- end }}
