replicaCount: 1

image:
  repository: postgres
  tag: 16-alpine
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5432

databases:
  - name: outline
    user: outline
    password: OutlineDB2026!
  - name: litellm
    user: litellm
    password: changeme123

config:
  maxConnections: 50
  sharedBuffers: 128MB
  workMem: 16MB
  effectiveCacheSize: 384MB
  maintenanceWorkMem: 64MB
  randomPageCost: 1.1
  effectiveIoConcurrency: 2
  walLevel: minimal
  maxWalSize: 1GB
  minWalSize: 256MB
  checkpointTimeout: 900
  logMinDurationStatement: 1000

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m