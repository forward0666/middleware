replicaCount: 1

image:
  repository: postgres
  tag: 16-alpine
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5432

databases:
  - name: outline
    user: outline
    password: OutlineDB2026!
  - name: litellm
    user: litellm
    password: changeme123

config:
  maxConnections: 50
  sharedBuffers: 128MB
  workMem: 8MB
  maintenanceWorkMem: 64MB
  effectiveCacheSize: 384MB
  randomPageCost: 1.1
  effectiveIoConcurrency: 2
  walLevel: replica
  maxWalSize: 1GB
  minWalSize: 256MB
  checkpointTimeout: 900
  maxWalBuffers: 16MB
  walBuffers: 16MB
  checkpointCompletion: 0.9
  logMinDurationStatement: 1000
  maxWorkerProcesses: 2
  maxParallelWorkers: 2
  maxParallelWorkersPerGather: 1
  maxParallelMaintenanceWorkers: 1
  autovacuum: on
  autovacuumMaxWorkers: 2
  autovacuumNaptime: 60
  autovacuumVacuumThreshold: 50
  autovacuumVacuumScaleFactor: 0.01
  idleInTransactionSessionTimeout: 60000
  tcpKeepalivesIdle: 60
  tcpKeepalivesInterval: 10
  tcpKeepalivesCount: 6
  statementTimeout: 30000

persistence:
  enabled: true
  size: 5Gi
  storageClass: ""

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m